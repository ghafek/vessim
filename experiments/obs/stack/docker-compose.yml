services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.1
    container_name: ppvs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${OBS_BIND_ADDRESS:-127.0.0.1}:${OBS_ES_PORT:-9200}:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.1
    container_name: ppvs-kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "${OBS_BIND_ADDRESS:-127.0.0.1}:${OBS_KIBANA_PORT:-5601}:5601"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ppvs-grafana
    ports:
      - "${OBS_BIND_ADDRESS:-127.0.0.1}:${OBS_GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.2
    container_name: ppvs-fluent-bit
    depends_on:
      - elasticsearch
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - ${PPVS_RESULTS_DIR}:/host_results:ro
    environment:
      - CLUSTER_NAME=${CLUSTER_NAME}
      - OBS_INDEX_PREFIX=${OBS_INDEX_PREFIX}
    restart: unless-stopped

volumes:
  esdata:
  grafana_data:
