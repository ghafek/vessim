[SERVICE]
    Flush        2
    Daemon       Off
    Log_Level    info
    Parsers_File /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /host_results/*.out,/host_results/*.err
    Tag               slurm.logs
    Read_from_Head    true
    Refresh_Interval  5
    Mem_Buf_Limit     10MB
    Skip_Long_Lines   On

[FILTER]
    Name      record_modifier
    Match     slurm.logs
    Record    cluster ${CLUSTER_NAME}
    Record    source fluent-bit

[OUTPUT]
    Name            es
    Match           slurm.logs
    Host            elasticsearch
    Port            9200
    Index           ${OBS_INDEX_PREFIX}-slurm-logs
    Logstash_Format On
    Suppress_Type_Name On
